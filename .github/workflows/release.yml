name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install

      - name: Install app dependencies
        run: cd app && npm install

      - name: Build Vite app (Electron mode)
        run: cd app && npx cross-env ELECTRON=true npm run build

      - name: Copy dist to root
        run: node -e "require('fs').cpSync('app/dist', 'dist', {recursive:true, force:true})"

      - name: Build and publish Electron installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ""
        run: npx electron-builder --publish always
